# ============================================
# Extract Doc 项目统一配置文件
# ============================================

# 应用基础配置
application:
  name: "extract_doc"
  version: "1.0.0"
  environment: "production"

# 文件路径配置
paths:
  input_directory: "his_pic"
  output_directory: "converted_files"
  log_directory: "logs"
  template_directory: "config/templates"

# 日志配置
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_path: "logs/app.log"
  max_file_size: 10485760  # 10MB
  backup_count: 5
  console_output: true

# PDF提取配置
pdf_extraction:
  # 是否启用OCR作为fallback
  enable_ocr_fallback: true
  # OCR检测阈值: 当检测到重复内容时触发OCR
  ocr_trigger_on_duplicate: true
  # OCR引擎配置
  ocr_engine:
    use_gpu: false
    lang: 'ch'  # 语言: ch(中英文), en(英文)
    use_angle_cls: true  # 是否支持旋转文字识别
    det_db_thresh: 0.3
    det_db_box_thresh: 0.6
    det_db_unclip_ratio: 1.5
    rec_batch_num: 6
    max_text_length: 25
    use_space_char: true
    drop_score: 0.5
    gpu_mem: 500
    enable_mkldnn: false
    cpu_threads: 10

# AI文档分析配置
ai_document_analysis:
  provider: "dashscope"
  model: "qwen3-max"  # 使用最新的Qwen3-Max模型
  temperature: 0.1
  max_tokens: 8192  # qwen3-max最大输出限制为65536 tokens，这里设置为8192以控制成本
  
  # 模型定价配置（单位：元/千Token）
  # 数据来源：https://help.aliyun.com/zh/model-studio/models
  # 更新时间：2025年1月
  pricing:
    # qwen-max (Qwen2.5-Max) - 降价88%后的新价格
    qwen-max:
      input: 0.0024   # 输入每千token 0.0024元
      output: 0.0096  # 输出每千token 0.0096元
    
    # qwen3-max - 阶梯计价（0-32K范围）
    qwen3-max:
      input: 0.006    # 输入每千token 0.006元（0-32K）
      output: 0.024   # 输出每千token 0.024元
    
    # qwen-plus
    qwen-plus:
      input: 0.0008   # 输入每千token 0.0008元
      output: 0.002   # 输出每千token 0.002元
    
    # qwen-turbo
    qwen-turbo:
      input: 0.0003   # 输入每千token 0.0003元
      output: 0.0006  # 输出每千token 0.0006元
   # qwen-long - 长文本模型
    qwen-long:
      input: 0.0005   # 输入每千token 0.0005元
      output: 0.002   # 输出每千token 0.002元

# 网页提取配置
web_extraction:
  cache_dir: "cache/web_extraction"  # 缓存目录，用于存储AI提取结果，避免重复调用
  timeout: 30  # HTTP请求超时时间（秒）
  
  # Playwright浏览器渲染配置（用于动态网站）
  use_browser: true  # 是否启用浏览器渲染
  browser_type: "chromium"  # 浏览器类型: chromium, firefox, webkit
  headless: true  # 无头模式（不显示浏览器窗口）
  page_load_timeout: 30000  # 页面加载超时（毫秒）
  wait_for_network_idle: true  # 等待网络空闲
  
  # 需要浏览器渲染的网站列表
  browser_required_sites:
    - "toutiao.com"  # 头条
    - "zhihu.com"    # 知乎
    - "csdn.net"     # CSDN
    - "juejin.cn"    # 掘金
    - "bilibili.com" # B站

# Word文档生成配置
word_generation:
  # 页边距配置（英寸）
  page_margins:
    top: 1.0
    bottom: 1.0
    left: 1.0
    right: 1.0
  
  # 字体大小配置（磅）
  font_sizes:
    title: 24
    subtitle: 14
    heading: 18
    body: 11
    table: 10
  
  # 颜色配置（RGB）
  colors:
    title: [0, 0, 0]
    subtitle: [64, 64, 64]
    placeholder: [128, 128, 128]
  
  # 图片配置
  image:
    max_width_inches: 6.0
    max_height_inches: 4.0
    default_dpi: 96
  
  # 表格配置
  table:
    style: "Light Grid Accent 1"
  
  # 样式模板配置
  styles:
    style_a:
      name: "标准文档"
      description: "通用文档格式"
      template_path: null
      paragraph_style: null
      font_name: "宋体"
      font_size: 12
    style_b:
      name: "报告文档"
      description: "正式报告格式"
      template_path: null
      paragraph_style: null
      font_name: "微软雅黑"
      font_size: 11

# PPT生成配置
ppt_generation:
  # 幻灯片尺寸（英寸）
  slide_size:
    width: 10.0
    height: 7.5
  
  # 布局配置
  margins: 0.5
  spacing: 0.3
  
  # 字体大小配置（磅）
  font_sizes:
    title: 24
    body: 14
    table: 11
  
  # 生成偏好
  generation_preferences:
    prefer_original_title: true      # 优先使用原文标题
    prefer_concise_content: false    # 不简化内容,保留完整性
    skip_low_importance: false       # 不跳过低重要度内容
    max_elements_per_slide: 5        # 每页最多元素数
    catalog_max_items: 30            # 目录最多显示项数
    catalog_min_item_height: 0.25    # 目录项最小高度（英寸）
    catalog_max_item_height: 0.5     # 目录项最大高度（英寸）
    catalog_available_height: 5.5    # 目录可用高度（英寸）
    catalog_start_y: 2.0             # 目录起始Y坐标（英寸）
    add_remaining_images: false      # 是否添加剩余图片（未在幻灯片中使用的图片）
    prefer_layouts:                  # 布局优先级
      - title_and_table
      - title_and_image
      - title_and_text
  
  # 封面标题配置
  cover_title:
    max_font_size: 66                # 最大字体大小（磅）
    min_font_size: 36                # 最小字体大小（磅）
    max_chars_per_line: 20           # 每行最大字符数（触发缩小字体）
    text_box_width: 10.0             # 文本框宽度（英寸）
    text_box_height: 1.5             # 文本框高度（英寸）
  
  # 布局类型配置
  layout_types:
    auto_detect: true                # 是否启用自动布局检测
    bullet_list:                     # 要点列表布局
      enabled: true
      max_items: 6
      indent_support: true
    two_column:                      # 左右对比布局
      enabled: true
      split_ratio: 0.5               # 左右比例
      max_text_length: 60            # 每个要点最大长度
    three_column:                    # 三列卡片布局
      enabled: true
      card_style: true
      max_cards: 10                   # 最多显示卡片数
      card_width: 3.5                # 卡片宽度（英寸）
      card_gap: 0.5                  # 卡片间隙（英寸）
      card_title_font_size: 20       # 卡片标题字体大小
      card_content_font_size: 12     # 卡片内容字体大小
      card_content_max_chars: 80     # 卡片内容最大字符数
    flow_diagram:                    # 流程图布局
      enabled: true
      arrow_style: true
      max_steps: 6                   # 最多显示步骤数
      base_step_width: 2.5           # 基础步骤框宽度（英寸）
      base_arrow_width: 0.8          # 基础箭头宽度（英寸）
      min_step_width: 1.5            # 最小步骤框宽度（英寸）
      min_arrow_width: 0.4           # 最小箭头宽度（英寸）
      step_title_font_size: 20       # 步骤标题字体大小
      step_desc_font_size: 12        # 步骤描述字体大小
      step_desc_max_chars: 25        # 步骤描述最大字符数
      content_area_width: 12.0       # 内容区域宽度（英寸）
    comparison:                      # 对比框布局
      enabled: true
      highlight_differences: true
    timeline:                        # 时间线布局
      enabled: true
      vertical: true
      max_items: 6                   # 最多显示项目数
      base_item_height: 1.2          # 基础项目高度（英寸）
      min_item_height: 0.8           # 最小项目高度（英寸）
      available_height: 5.5          # 可用高度（英寸）
      start_y: 2.0                   # 起始Y坐标（英寸）
      title_font_size: 18            # 标题字体大小
      content_font_size: 14          # 内容字体大小
      content_max_chars: 60          # 内容最大字符数
  
  # 样式模板配置
  styles:
    style_a:
      style_name: "style_a"  # 样式标识符
      name: "简约商务风格"
      description: "适合商务汇报、项目展示"
      template_path: "config/templates/business_template.pptx"
      title: "自动生成演示文稿"
      subtitle: "基于内容智能整理"
      bullet_layout_index: 1
      title_font_size: 44
      content_font_size: 18
    style_b:
      style_name: "style_b"  # 样式标识符
      name: "学术报告风格"
      description: "适合学术论文、研究报告"
      template_path: "config/templates/academic_template.pptx"
      title: "研究成果展示"
      subtitle: "数据驱动的内容呈现"
      bullet_layout_index: 1
      title_font_size: 40
      content_font_size: 16

# 文本处理配置
text_processing:
  min_text_length: 2
  max_text_length: 1000
  merge_threshold: 50
  table_detection_threshold: 0.7
  enable_text_cleaning: true
  enable_ocr_error_correction: true
  group_nearby_elements: true
  proximity_threshold: 30

# 文本格式化配置
text_formatting:
  # Bullet符号
  bullet_level_0: "●"  # 一级：实心圆
  bullet_level_1: "○"  # 二级：空心圆
  bullet_level_2: "▪"  # 三级：方块
  
  # 字体大小（磅）
  font_size_level_0: 20
  font_size_level_1: 18
  font_size_level_2: 16
  
  # 缩进设置（英寸）
  indent_base: 0.3
  indent_increment: 0.4
